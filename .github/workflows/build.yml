name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Framelight.app (SwiftPM, universal)
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Verify app icon
        run: |
          iconutil -c iconset dist/Framelight.app/Contents/Resources/AppIcon.icns -o /tmp/AppIcon.iconset
          ls /tmp/AppIcon.iconset
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" dist/Framelight.app/Contents/Info.plist

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Framelight.app Framelight.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Framelight-app
          path: dist/Framelight.zip

      - name: Build Xcode project incl. virtual camera extension (unsigned)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Framelight.xcodeproj -scheme Framelight -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          ls build/Build/Products/Release/Framelight.app/Contents/Library/SystemExtensions
          ls build/Build/Products/Release/Framelight.app/Contents/Resources

      - name: UVC parser checks
        run: |
          swiftc -swift-version 5 Sources/Framelight/UVC/UVCDescriptors.swift Sources/Framelight/UVC/UVCControls.swift Tests/ParserCheck/main.swift -o parsercheck
          ./parsercheck

      - name: Auto framing simulation
        run: |
          swiftc -swift-version 5 Sources/Framelight/Processing/AutoFramer.swift Sources/Framelight/Processing/ProcessingSettings.swift \
            Sources/Framelight/Processing/GradeEngine.swift Sources/Framelight/Processing/ColorMath.swift \
            Sources/Framelight/Processing/Gestures.swift Tests/FramingCheck/main.swift -o framingcheck
          ./framingcheck

      - name: Natural colour engine checks
        run: |
          swiftc -O -swift-version 5 Sources/Framelight/Processing/ColorMath.swift Sources/Framelight/Processing/GradeEngine.swift \
            Sources/Framelight/Processing/LUTLibrary.swift Sources/Framelight/Processing/Gestures.swift \
            Sources/Framelight/Processing/ProcessingSettings.swift Tests/ColorCheck/main.swift -o colorcheck
          ./colorcheck

      - name: Benchmark (speed + quality vs. typical methods)
        run: |
          dist/Framelight.app/Contents/MacOS/Framelight --benchmark --out benchmark.md
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: benchmark.md
          if-no-files-found: ignore
