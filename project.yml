# Generates Framelight.xcodeproj with the virtual camera (Core Media I/O system extension).
#   brew install xcodegen && xcodegen generate && open Framelight.xcodeproj
# Set DEVELOPMENT_TEAM below (or in Xcode → Signing & Capabilities) to your Apple Developer Team ID.
name: Framelight
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    APP_BUNDLE_ID: com.framelight.app
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Framelight:
    type: application
    platform: macOS
    sources:
      - path: Sources/Framelight
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Framelight
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Framelight.entitlements
    dependencies:
      - target: FramelightCameraExtension
        embed: true
        codeSign: true
      - sdk: SystemExtensions.framework
      - sdk: CoreMediaIO.framework
      - sdk: IOKit.framework
  FramelightCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension
      - path: Sources/Framelight/Shared/VirtualCameraConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).CameraExtension
        PRODUCT_NAME: $(APP_BUNDLE_ID).CameraExtension
        INFOPLIST_FILE: CameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: CoreMediaIO.framework
schemes:
  Framelight:
    build:
      targets:
        Framelight: all
        FramelightCameraExtension: all
    run:
      config: Debug
    archive:
      config: Release
